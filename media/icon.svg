<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#3c1f62"/>
      <stop offset="0.6" stop-color="#1f1036"/>
      <stop offset="1" stop-color="#0f071c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a2a6e"/>
      <stop offset="1" stop-color="#2a0f30"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="1" stop-color="#c9b48a"/>
    </linearGradient>
    <radialGradient id="fel" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8dff5a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8dff5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medal" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#2f6b1e"/>
      <stop offset="1" stop-color="#0d2309"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2ffc8"/>
      <stop offset="0.5" stop-color="#7fe04a"/>
      <stop offset="1" stop-color="#2f8a1c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.8">
    <circle cx="30" cy="40" r="1.6"/><circle cx="372" cy="262" r="1.8"/><circle cx="118" cy="22" r="1.4"/>
    <circle cx="292" cy="20" r="1.4"/><circle cx="24" cy="232" r="1.8"/><circle cx="380" cy="150" r="1.4"/>
    <circle cx="44" cy="356" r="1.5"/>
  </g>

  <!-- fel glow behind the book -->
  <ellipse cx="196" cy="212" rx="170" ry="160" fill="url(#fel)"/>

  <!-- the grimoire, standing, a little turned -->
  <g transform="rotate(-6 196 212)" stroke-linejoin="round">
    <!-- page block on the right -->
    <path d="M282,72 L300,84 L300,346 L282,352 Z" fill="url(#pages)" stroke="#3a2306" stroke-width="4"/>
    <g stroke="#a8916a" stroke-width="1.6" opacity="0.8">
      <path d="M286,100 L296,106"/><path d="M286,150 L296,154"/><path d="M286,200 L296,204"/>
      <path d="M286,250 L296,252"/><path d="M286,300 L296,302"/>
    </g>
    <!-- cover -->
    <rect x="96" y="66" width="190" height="290" rx="12" fill="url(#leather)" stroke="#3a2306" stroke-width="6"/>
    <!-- spine band -->
    <rect x="96" y="66" width="26" height="290" rx="10" fill="#1d0a22" opacity="0.55"/>
    <g fill="url(#gold)" stroke="#3a2306" stroke-width="3">
      <rect x="98" y="104" width="22" height="10" rx="3"/>
      <rect x="98" y="308" width="22" height="10" rx="3"/>
    </g>
    <!-- gold frame on the cover -->
    <rect x="134" y="84" width="136" height="254" rx="8" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <!-- corner guards -->
    <g fill="url(#gold)" stroke="#3a2306" stroke-width="3">
      <path d="M286,66 L286,104 L264,88 L248,66 Z"/>
      <path d="M286,356 L286,318 L264,334 L248,356 Z"/>
    </g>

    <!-- the demon sigil -->
    <circle cx="202" cy="208" r="66" fill="#8dff5a" opacity="0.32" filter="url(#glow)"/>
    <circle cx="202" cy="208" r="58" fill="url(#medal)" stroke="#3a2306" stroke-width="10"/>
    <circle cx="202" cy="208" r="58" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <!-- horned head -->
    <g fill="url(#gold)" stroke="#3a2306" stroke-width="3">
      <path d="M176,196 C160,186 152,166 160,142 C166,162 176,172 188,178 Z"/>
      <path d="M228,196 C244,186 252,166 244,142 C238,162 228,172 216,178 Z"/>
      <path d="M202,174 C222,174 234,186 232,204 C230,224 216,242 202,250 C188,242 174,224 172,204 C170,186 182,174 202,174 Z"/>
    </g>
    <!-- glowing eyes -->
    <g fill="#c8ff8a" filter="url(#glow)">
      <path d="M184,204 L196,207 L186,212 Z"/>
      <path d="M220,204 L208,207 L218,212 Z"/>
    </g>
    <path d="M194,228 L202,232 L210,228" fill="none" stroke="#3a2306" stroke-width="3" stroke-linecap="round"/>

    <!-- ribbon bookmark -->
    <path d="M232,352 L232,388 L242,378 L252,388 L252,352" fill="url(#green)" stroke="#3a2306" stroke-width="3"/>
  </g>

  <!-- check badge: this one is learned -->
  <g transform="translate(316,92)">
    <circle r="30" fill="url(#green)" stroke="#3a2306" stroke-width="4.5"/>
    <path d="M-13,1 L-4,11 L14,-10" fill="none" stroke="#1a3a10" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff6d0">
    <path d="M58,96 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M348,190 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
    <path d="M60,290 l2.5,7.5 l7.5,2.5 l-7.5,2.5 l-2.5,7.5 l-2.5,-7.5 l-7.5,-2.5 l7.5,-2.5 z"/>
  </g>
  <g fill="#8dff5a" filter="url(#glow)">
    <circle cx="40" cy="170" r="3.5"/><circle cx="360" cy="300" r="3"/><circle cx="160" cy="34" r="2.5"/>
  </g>
</svg>
